stt:
  provider: deepgram
  model: nova-3
  language: en-US
  endpoint: https://api.deepgram.com/v1/listen
  secret_ref: DEEPGRAM_API_KEY
  smart_format: true
  endpointing_ms: 300
  mip_opt_out: true
tts:
  provider: deepgram
  model: aura-2
  voice: asteria
  language: en
  endpoint: https://api.deepgram.com/v1/speak
  secret_ref: DEEPGRAM_API_KEY
  sample_rate: 24000
  mip_opt_out: true
llm:
  provider: openrouter
  endpoint: https://openrouter.ai/api/v1
  secret_ref: OPENROUTER_API_KEY
  models:
    - poolside/laguna-xs-2.1:free
    - z-ai/glm-5.2:free
    - cohere/north-mini-code:free
  site_url: https://voice.relate-ai.site
  app_name: Relate LiveKit Voice
  temperature: 0.4
  max_tokens: 300
  timeout_seconds: 20
fallback:
  eligible_http_statuses: [429, 500, 502, 503, 504]
  eligible_categories: [rate_limit, timeout, transient, unavailable]
  max_attempts_per_model: 1
turn_handling:
  turn_detection: turn_detector
  endpointing:
    min_delay_seconds: 0.5
    max_delay_seconds: 3.0
  interruption:
    enabled: true
    mode: vad
    min_duration_seconds: 0.5
    min_words: 0
    resume_false_interruption: true
    false_interruption_timeout_seconds: 2.0
  preemptive_generation:
    enabled: true
    preemptive_tts: false
    max_speech_duration: 10.0
    max_retries: 3
  user_turn_limit:
    max_words: 200
    max_duration: 60.0
agent:
  dispatch_name: relate-voice-agent
  display_name: Relate Voice
  instructions: >
    You are a warm, helpful voice assistant. Speak naturally and conversationally.
    Keep responses concise — aim for 1 to 3 sentences unless the user asks for detail.
    Use plain spoken language. Never use markdown, bullet points, asterisks, or formatting.
    If you need time to think, say something brief like "let me check" rather than staying silent.
    If you don't understand, ask the user to clarify rather than guessing.
    Never fabricate information. If you're unsure, say so honestly.
    Address the user by name only if they've introduced themselves.
  greeting: Hello! I'm your voice assistant. How can I help you today?
ui:
  public_url: https://voice.relate-ai.site
  livekit_url: wss://livekit.relate-ai.site
  token_ttl_seconds: 120
  max_sessions_per_window: 10
  rate_window_seconds: 3600
observability:
  log_level: INFO
  log_model_identity: true
  log_prompts: false
  prometheus_port: 9090
