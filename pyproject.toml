[project]
name = "relate-livekit-voice"
version = "0.1.0"
description = "Provider-neutral self-hosted LiveKit voice agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "livekit-agents==1.8.0",
  "livekit-api==1.2.1",
  "livekit-plugins-deepgram==1.8.0",
  "livekit-plugins-openai==1.8.0",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
  "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relate_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["relate_voice"]
mypy_path = "src"
