<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Relate continuous voice conversation" />
    <title>Relate Voice</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">RELATE / LIVE VOICE</p>
      <h1>Talk naturally.<br />Interrupt freely.</h1>
      <div class="orb" aria-hidden="true"><span></span></div>
      <p id="status" role="status" aria-live="polite">Ready</p>
      <p id="detail">One click starts a continuous hands-free conversation.</p>
      <div class="actions">
        <button id="start" type="button">Start Conversation</button>
        <button id="end" type="button" disabled>End</button>
      </div>
      <p id="error" role="alert"></p>
      <div id="audio" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
